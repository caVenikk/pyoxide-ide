[workspace]
resolver = "3"
members = [
    "crates/platform/commands",
    "crates/platform/console",
    "crates/platform/db-core",
    "crates/platform/db-oracle-thin",
    "crates/platform/db-oracle-odpi",
    "crates/platform/db-postgres",
    "crates/platform/db-sqlite",
    "crates/platform/db-service",
    "crates/platform/db-testkit",
    "crates/platform/name-match",
    "crates/platform/process",
    "crates/platform/project",
    "crates/platform/project-search",
    "crates/platform/search",
    "crates/platform/db-cli",
    "crates/platform/editor",
    "crates/platform/file-index",
    "crates/platform/secrets",
    "crates/platform/settings-import",
    "crates/platform/syntax",
    "crates/platform/text",
    "crates/platform/themes",
    "crates/platform/ui",
    "crates/platform/workbench",
    "crates/python/py-env",
    "crates/python/py-run",
    "crates/python/py-syntax",
    "crates/python/pyoxide-cli",
    "crates/python/pyoxide-ide",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caVenikk/pyoxide-ide"
rust-version = "1.89"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
quick-xml = "0.42"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
zeroize = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# UI toolkit (ADR 0006, 0007): the crates.io release, pinned exactly.
gpui = "=0.2.2"
# Same major version as GPUI uses, for colour icons at device scale.
resvg = { version = "0.45", default-features = false }
commands = { path = "crates/platform/commands" }
console = { path = "crates/platform/console" }
db-core = { path = "crates/platform/db-core" }
editor = { path = "crates/platform/editor" }
name-match = { path = "crates/platform/name-match" }
process = { path = "crates/platform/process" }
file-index = { path = "crates/platform/file-index" }
db-oracle-thin = { path = "crates/platform/db-oracle-thin" }
db-oracle-odpi = { path = "crates/platform/db-oracle-odpi" }
db-postgres = { path = "crates/platform/db-postgres" }
db-sqlite = { path = "crates/platform/db-sqlite" }
db-service = { path = "crates/platform/db-service" }
db-testkit = { path = "crates/platform/db-testkit" }
project = { path = "crates/platform/project" }
project-search = { path = "crates/platform/project-search" }
search = { path = "crates/platform/search" }
secrets = { path = "crates/platform/secrets" }
settings-import = { path = "crates/platform/settings-import" }
syntax = { path = "crates/platform/syntax" }
text = { path = "crates/platform/text" }
themes = { path = "crates/platform/themes" }
ui = { path = "crates/platform/ui" }
workbench = { path = "crates/platform/workbench" }
py-env = { path = "crates/python/py-env" }
py-run = { path = "crates/python/py-run" }
py-syntax = { path = "crates/python/py-syntax" }

# Dependencies (GPUI, tree-sitter, ropey, ...) are optimized in debug builds
# as well: a debug build of the IDE stays responsive enough to use, while
# the workspace crates keep fast incremental builds and full debug info
# (ADR 0007). Release builds are unaffected.
[profile.dev.package."*"]
opt-level = 2
