[workspace]
resolver = "3"
members = [
    "crates/platform/commands",
    "crates/platform/db-core",
    "crates/platform/db-oracle-thin",
    "crates/platform/db-oracle-odpi",
    "crates/platform/db-postgres",
    "crates/platform/db-sqlite",
    "crates/platform/db-service",
    "crates/platform/db-testkit",
    "crates/platform/db-cli",
    "crates/platform/secrets",
    "crates/platform/settings-import",
    "crates/python/py-env",
    "crates/python/pyoxide-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caVenikk/pyoxide-ide"
rust-version = "1.89"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
zeroize = "1"
commands = { path = "crates/platform/commands" }
db-core = { path = "crates/platform/db-core" }
db-oracle-thin = { path = "crates/platform/db-oracle-thin" }
db-oracle-odpi = { path = "crates/platform/db-oracle-odpi" }
db-postgres = { path = "crates/platform/db-postgres" }
db-sqlite = { path = "crates/platform/db-sqlite" }
db-service = { path = "crates/platform/db-service" }
db-testkit = { path = "crates/platform/db-testkit" }
secrets = { path = "crates/platform/secrets" }
settings-import = { path = "crates/platform/settings-import" }
py-env = { path = "crates/python/py-env" }
