[workspace]
resolver = "3"
members = [
    "crates/platform/code-intel",
    "crates/platform/code-intel-ui",
    "crates/platform/commands",
    "crates/platform/console",
    "crates/platform/dap-client",
    "crates/platform/db-core",
    "crates/platform/db-oracle-thin",
    "crates/platform/db-oracle-odpi",
    "crates/platform/db-postgres",
    "crates/platform/db-sqlite",
    "crates/platform/db-service",
    "crates/platform/db-testkit",
    "crates/platform/debugger",
    "crates/platform/name-match",
    "crates/platform/process",
    "crates/platform/project",
    "crates/platform/project-search",
    "crates/platform/run-config",
    "crates/platform/search",
    "crates/platform/db-cli",
    "crates/platform/editor",
    "crates/platform/file-index",
    "crates/platform/file-watcher",
    "crates/platform/lsp-client",
    "crates/platform/secrets",
    "crates/platform/settings",
    "crates/platform/settings-import",
    "crates/platform/settings-ui",
    "crates/platform/stream-framing",
    "crates/platform/syntax",
    "crates/platform/terminal",
    "crates/platform/text",
    "crates/platform/themes",
    "crates/platform/ui",
    "crates/platform/vcs",
    "crates/platform/git",
    "crates/platform/workbench",
    "crates/python/py-debug",
    "crates/python/py-env",
    "crates/python/py-lsp",
    "crates/python/py-run",
    "crates/python/py-syntax",
    "crates/python/pyoxide-cli",
    "crates/python/pyoxide-ide",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caVenikk/pyoxide-ide"
rust-version = "1.89"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
quick-xml = "0.42"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
zeroize = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Deleting files to the system trash (#37), as the reference IDE does.
trash = "5.2"
# Language services (ADR 0010): channels and futures without an async
# runtime, protocol types kept private to lsp-client, Markdown parsing for
# documentation.
flume = "0.11"
futures = "0.3"
lsp-types = "=0.95.1"
pulldown-cmark = { version = "0.13", default-features = false }
# Changes on disk made outside the application (CC0-1.0): FSEvents on
# macOS, inotify on Linux, ReadDirectoryChangesW on Windows.
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
# Terminal emulator and pseudo-terminal (ADR 0014, Apache-2.0), pinned
# exactly: only the `terminal` crate uses it, without its event loop.
alacritty_terminal = "=0.26.0"
# Line diffs of version control (ADR 0016, Apache-2.0): git's histogram
# algorithm, so change markers match the hunks of `git diff`.
imara-diff = "0.2"
# UI toolkit (ADR 0006, 0007): the crates.io release, pinned exactly.
gpui = "=0.2.2"
# Same major version as GPUI uses, for colour icons at device scale.
resvg = { version = "0.45", default-features = false }
code-intel = { path = "crates/platform/code-intel" }
code-intel-ui = { path = "crates/platform/code-intel-ui" }
commands = { path = "crates/platform/commands" }
console = { path = "crates/platform/console" }
dap-client = { path = "crates/platform/dap-client" }
db-core = { path = "crates/platform/db-core" }
editor = { path = "crates/platform/editor" }
lsp-client = { path = "crates/platform/lsp-client" }
name-match = { path = "crates/platform/name-match" }
process = { path = "crates/platform/process" }
file-index = { path = "crates/platform/file-index" }
file-watcher = { path = "crates/platform/file-watcher" }
git = { path = "crates/platform/git" }
db-oracle-thin = { path = "crates/platform/db-oracle-thin" }
db-oracle-odpi = { path = "crates/platform/db-oracle-odpi" }
db-postgres = { path = "crates/platform/db-postgres" }
db-sqlite = { path = "crates/platform/db-sqlite" }
db-service = { path = "crates/platform/db-service" }
db-testkit = { path = "crates/platform/db-testkit" }
debugger = { path = "crates/platform/debugger" }
project = { path = "crates/platform/project" }
project-search = { path = "crates/platform/project-search" }
run-config = { path = "crates/platform/run-config" }
search = { path = "crates/platform/search" }
secrets = { path = "crates/platform/secrets" }
settings = { path = "crates/platform/settings" }
settings-import = { path = "crates/platform/settings-import" }
settings-ui = { path = "crates/platform/settings-ui" }
stream-framing = { path = "crates/platform/stream-framing" }
syntax = { path = "crates/platform/syntax" }
terminal = { path = "crates/platform/terminal" }
text = { path = "crates/platform/text" }
themes = { path = "crates/platform/themes" }
ui = { path = "crates/platform/ui" }
vcs = { path = "crates/platform/vcs" }
workbench = { path = "crates/platform/workbench" }
py-debug = { path = "crates/python/py-debug" }
py-env = { path = "crates/python/py-env" }
py-lsp = { path = "crates/python/py-lsp" }
py-run = { path = "crates/python/py-run" }
py-syntax = { path = "crates/python/py-syntax" }

# Dependencies (GPUI, tree-sitter, ropey, ...) are optimized in debug builds
# as well: a debug build of the IDE stays responsive enough to use, while
# the workspace crates keep fast incremental builds and full debug info
# (ADR 0007). Release builds are unaffected.
[profile.dev.package."*"]
opt-level = 2
