[workspace]
resolver = "3"
members = [
    "crates/commands",
    "crates/db-core",
    "crates/db-oracle-thin",
    "crates/db-oracle-odpi",
    "crates/db-postgres",
    "crates/db-sqlite",
    "crates/db-service",
    "crates/db-cli",
    "crates/secrets",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caVenikk/pyoxide-ide"
rust-version = "1.88"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
zeroize = "1"
commands = { path = "crates/commands" }
db-core = { path = "crates/db-core" }
db-oracle-thin = { path = "crates/db-oracle-thin" }
db-oracle-odpi = { path = "crates/db-oracle-odpi" }
db-postgres = { path = "crates/db-postgres" }
db-sqlite = { path = "crates/db-sqlite" }
db-service = { path = "crates/db-service" }
secrets = { path = "crates/secrets" }
