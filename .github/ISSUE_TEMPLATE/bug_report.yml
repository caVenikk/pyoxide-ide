name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what did you get?
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations: {required: true}
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, macOS, Linux, Other]
    validations: {required: true}
  - type: input
    id: hw
    attributes:
      label: Hardware (CPU, RAM, GPU)
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots of Pyoxide
      description: Do not paste secrets, connection strings or content from proprietary software.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues
          required: true
        - label: This report contains no secrets or private data
          required: true
