name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # GPUI (the UI toolkit, ADR 0006) links X11, Wayland, xkbcommon and
      # fontconfig on Linux; tests use its headless test platform.
      - name: Linux packages for GPUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Tests run under cargo-nextest (.config/nextest.toml). The action is
      # pinned to a commit and installs a checksummed prebuilt binary.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo fmt --all --check
      # Debug builds optimize dependencies so that the IDE stays responsive
      # when run from a debug build (ADR 0007). CI does not need that:
      # clippy and the tests build dependencies without optimization, which
      # keeps the builds short.
      - run: >-
          cargo clippy --workspace --all-targets
          --config 'profile.dev.package."*".opt-level=0' -- -D warnings
        shell: bash
      - run: >-
          cargo nextest run --workspace --profile ci
          --config 'profile.dev.package."*".opt-level=0'
        shell: bash
      # Terminal throughput (ADR 0014): a flood through the PTY (ConPTY on
      # Windows) into the emulator, and the emulator alone; the numbers go
      # to the log. Reuses the test build of the step above.
      - run: >-
          cargo test -p terminal --test throughput
          --config 'profile.dev.package."*".opt-level=0' -- --ignored --nocapture
        shell: bash
      # nextest does not run doctests.
      - run: cargo test --doc --workspace --config 'profile.dev.package."*".opt-level=0'
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore

  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/progress.py --check
      - run: python3 scripts/check-layers.py

  # Ignored tests against real databases (docs/testing-databases.md). The
  # Oracle Client backend is excluded: it needs Oracle Instant Client.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pyoxide
          POSTGRES_PASSWORD: pyoxide
          POSTGRES_DB: pyoxide
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U pyoxide -d pyoxide"
          --health-interval 5s --health-timeout 5s --health-retries 30
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: pyoxide
          APP_USER: pyoxide
          APP_USER_PASSWORD: pyoxide
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      PYOXIDE_DB_PASSWORD: pyoxide
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo test -p db-postgres -p db-sqlite -p db-oracle-thin -p db-service
          --config 'profile.dev.package."*".opt-level=0' -- --ignored --skip bench_

  # Downloadable pyoxide-db builds (workflow artifacts), e.g. to run
  # `pyoxide-db diagnose` on a machine without a Rust toolchain.
  binaries:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: pyoxide-db-windows-x86_64
            file: pyoxide-db.exe
          - os: macos-latest
            name: pyoxide-db-macos-aarch64
            file: pyoxide-db
          - os: ubuntu-latest
            name: pyoxide-db-linux-x86_64
            file: pyoxide-db
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p db-cli
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/release/${{ matrix.file }}
          if-no-files-found: error
