name: CI scope experiment
on:
  workflow_dispatch:
    inputs:
      source:
        description: Immutable feature commit to measure
        required: true
        type: string
      base:
        description: Immutable target commit for the affected package plan
        required: true
        type: string

# This prototype is never merged. It cannot emit CI required or full-run proofs.
permissions:
  contents: read
jobs:
  # Keep the production job ID: rust-cache includes it in the default key.
  check:
    name: Paired macOS (${{ matrix.order }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        order: [AB, BA]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Preserve experiment driver outside measured checkout
        run: cp scripts/ci-cache-experiment.py "$RUNNER_TEMP/ci-cache-experiment.py"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Match the existing main cache for both modes. Production stays on stable.
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          save-if: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-nextest@0.9.148
      - name: Measure identical baseline in both orders
        env:
          EXPERIMENT_SOURCE: ${{ inputs.source }}
          EXPERIMENT_BASE: ${{ inputs.base }}
          EXPERIMENT_ORDER: ${{ matrix.order }}
          EXPERIMENT_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: python3 "$RUNNER_TEMP/ci-cache-experiment.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scope-experiment-macos-${{ matrix.order }}
          path: ${{ runner.temp }}/scope-experiment/
          retention-days: 14
          if-no-files-found: error
