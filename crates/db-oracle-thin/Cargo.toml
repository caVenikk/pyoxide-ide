[package]
name = "db-oracle-thin"
description = "Oracle backend in pure Rust (no Oracle Client needed), via the oracle-rs crate"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
db-core.workspace = true
async-trait.workspace = true
chrono.workspace = true
tokio.workspace = true
oracle-rs = "0.1.7"
# Only to install a process-wide crypto provider before oracle-rs builds its
# TLS configuration (ring, as everywhere else; see ADR 0003).
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

[dev-dependencies]
tokio.workspace = true
