# ---- Main Menu > Window --------------------------------------------------

[[action]]
id = "HideActiveWindow"
text = "Hide Active Tool Window"
groups = ["Main Menu > Window > Active Tool Window"]
command = "workbench.hide-tool-window"
contexts = ["ProjectTree", "RunToolWindow", "Terminal"]

[[action]]
id = "ShowContent"
text = "Show List of Tabs"
groups = ["Main Menu > Window > Active Tool Window"]
command = "terminal.show-tab-list"
context = "Terminal"

[[action]]
id = "NextTab"
text = "Select Next Tab"
groups = ["Main Menu > Window > Editor Tabs"]
commands = [
  { command = "tabs.next" },
  { command = "terminal.next-tab", contexts = ["Terminal"] },
]

[[action]]
id = "PreviousTab"
text = "Select Previous Tab"
groups = ["Main Menu > Window > Editor Tabs"]
commands = [
  { command = "tabs.previous" },
  { command = "terminal.previous-tab", contexts = ["Terminal"] },
]

[[action]]
id = "CloseContent"
text = "Close Tab"
groups = ["Main Menu > Window > Editor Tabs > Editor Close Actions"]
commands = [
  { command = "tabs.close" },
  { command = "run.close-tab", contexts = ["RunToolWindow", "RunConsole > Editor"] },
]
