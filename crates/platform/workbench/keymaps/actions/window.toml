# ---- Main Menu > Window --------------------------------------------------

[[action]]
id = "MinimizeCurrentWindow"
text = "Minimize"
groups = ["Main Menu > Window"]
command = "window.minimize"

[[action]]
id = "ZoomCurrentWindow"
text = "Zoom"
groups = ["Main Menu > Window"]
command = "window.zoom"

[[action]]
id = "HideActiveWindow"
text = "Hide Active Tool Window"
groups = ["Main Menu > Window > Active Tool Window"]
command = "workbench.hide-tool-window"
contexts = ["ProjectTree", "RunToolWindow", "Terminal"]

[[action]]
id = "ShowContent"
text = "Show List of Tabs"
groups = ["Main Menu > Window > Active Tool Window"]
command = "terminal.show-tab-list"
context = "Terminal"

[[action]]
id = "NextTab"
text = "Select Next Tab"
groups = ["Main Menu > Window > Editor Tabs"]
commands = [
  { command = "tabs.next" },
  { command = "terminal.next-tab", contexts = ["Terminal"] },
]

[[action]]
id = "PreviousTab"
text = "Select Previous Tab"
groups = ["Main Menu > Window > Editor Tabs"]
commands = [
  { command = "tabs.previous" },
  { command = "terminal.previous-tab", contexts = ["Terminal"] },
]

[[action]]
id = "PinActiveEditorTab"
text = "Pin Active Tab"
groups = ["Main Menu > Window > Editor Tabs"]
command = "tabs.toggle-pin"

[[action]]
id = "CloseContent"
text = "Close Tab"
groups = ["Main Menu > Window > Editor Tabs > Editor Close Actions"]
commands = [
  { command = "tabs.close" },
  { command = "run.close-tab", contexts = ["RunToolWindow", "RunConsole > Editor"] },
]

[[action]]
id = "CloseAllEditorsButActive"
text = "Close Other Tabs"
groups = ["Main Menu > Window > Editor Tabs > Editor Close Actions"]
command = "tabs.close-others"

[[action]]
id = "CloseAllEditors"
text = "Close All Tabs"
groups = ["Main Menu > Window > Editor Tabs > Editor Close Actions"]
command = "tabs.close-all"

[[action]]
id = "CloseAllUnmodifiedEditors"
text = "Close Unmodified Tabs"
groups = ["Main Menu > Window > Editor Tabs > Editor Close Actions"]
command = "tabs.close-unmodified"

[[action]]
id = "CloseAllUnpinnedEditors"
text = "Close All but Pinned"
groups = ["Main Menu > Window > Editor Tabs > Editor Close Actions"]
command = "tabs.close-unpinned"

[[action]]
id = "CloseAllToTheLeft"
text = "Close Tabs to the Left"
groups = ["Main Menu > Window > Editor Tabs > Editor Close Actions"]
command = "tabs.close-left"

[[action]]
id = "CloseAllToTheRight"
text = "Close Tabs to the Right"
groups = ["Main Menu > Window > Editor Tabs > Editor Close Actions"]
command = "tabs.close-right"

[[action]]
id = "ShowProcessWindow"
text = "Show"
groups = ["Main Menu > Window > Processes"]
command = "background-tasks.show"
