# Default keymap of Pyoxide on Windows and Linux. Keystrokes follow the
# reference IDE's default keymap (IntelliJ Platform Community keymap files,
# Apache-2.0, see NOTICE); commands are Pyoxide's own (ADR 0007).
#
# A section applies where its key context matches (GPUI predicates); a
# deeper context wins, and of two bindings for the same context the later
# one wins.

[[context]]
[context.bindings]
"ctrl-alt-s" = "settings.open"
# Quick Switch Scheme: the Switch popup (Theme).
"ctrl-`" = "settings.quick-switch"
"alt-1" = "workbench.toggle-project"
"alt-4" = "workbench.toggle-run"
"ctrl-s" = "workbench.save-all"
"ctrl-alt-y" = "workbench.synchronize"
"ctrl-f4" = "tabs.close"
"alt-right" = "tabs.next"
"alt-left" = "tabs.previous"
"ctrl-shift-f" = "find-in-files.open"
"ctrl-shift-r" = "find-in-files.open-replace"
"shift shift" = "search-everywhere.open"
"ctrl-shift-n" = "search-everywhere.go-to-file"
"ctrl-shift-a" = "search-everywhere.go-to-action"
"ctrl-alt-shift-e" = "search-everywhere.go-to-text"
"ctrl-e" = "recent-files.open"
# Navigation history: Back and Forward, also the mouse's back and
# forward buttons.
"ctrl-alt-left" = "workbench.back"
"button4" = "workbench.back"
"ctrl-alt-right" = "workbench.forward"
"button5" = "workbench.forward"
# Run: the current file (Current File is the only configuration yet);
# Run Context Configuration runs it as well; Stop stops the run, a second
# Stop kills it.
"shift-f10" = "run.run"
"ctrl-shift-f10" = "run.current-file"
"ctrl-f2" = "run.stop"
# Choose Run Configuration: the run widget's dropdown (the Run tool window's
# empty state names this key).
"alt-shift-f10" = "run.configurations"

[[context]]
name = "ProjectTree"
[context.bindings]
"up" = "project.tree.up"
"down" = "project.tree.down"
"right" = "project.tree.expand"
"left" = "project.tree.collapse"
"enter" = "project.tree.open"
"f4" = "project.tree.open"
"ctrl--" = "project.tree.collapse-all"
"ctrl-=" = "project.tree.expand-all"
"escape" = "workbench.focus-editor"
"shift-escape" = "workbench.hide-tool-window"
"menu" = "project.tree.context-menu"
# File operations (#37): New (NewElement), Rename (RenameElement), Delete
# ($Delete).
"alt-insert" = "project.tree.new"
"shift-f6" = "project.tree.rename"
"delete" = "project.tree.delete"
# Cut, Copy, Paste ($Cut, $Copy, $Paste), Move (F6), Copy (CopyElement,
# F5), Copy Paths.
"ctrl-x" = "project.tree.cut"
"shift-delete" = "project.tree.cut"
"ctrl-c" = "project.tree.copy"
"ctrl-insert" = "project.tree.copy"
"ctrl-v" = "project.tree.paste"
"shift-insert" = "project.tree.paste"
"f6" = "project.tree.move"
"f5" = "project.tree.copy-element"
"ctrl-shift-c" = "project.tree.copy-paths"

[[context]]
name = "Editor"
[context.bindings]
# Caret movement
"left" = "editor.move-left"
"right" = "editor.move-right"
"up" = "editor.move-up"
"down" = "editor.move-down"
"ctrl-left" = "editor.move-word-left"
"ctrl-right" = "editor.move-word-right"
"home" = "editor.move-line-start"
"end" = "editor.move-line-end"
"ctrl-home" = "editor.move-document-start"
"ctrl-end" = "editor.move-document-end"
"pageup" = "editor.page-up"
"pagedown" = "editor.page-down"
"ctrl-g" = "workbench.go-to-line"
# Selection
"shift-left" = "editor.select-left"
"shift-right" = "editor.select-right"
"shift-up" = "editor.select-up"
"shift-down" = "editor.select-down"
"ctrl-shift-left" = "editor.select-word-left"
"ctrl-shift-right" = "editor.select-word-right"
"shift-home" = "editor.select-line-start"
"shift-end" = "editor.select-line-end"
"ctrl-shift-home" = "editor.select-document-start"
"ctrl-shift-end" = "editor.select-document-end"
"shift-pageup" = "editor.select-page-up"
"shift-pagedown" = "editor.select-page-down"
"ctrl-a" = "editor.select-all"
"ctrl-w" = "editor.select-word"
"ctrl-shift-w" = "editor.shrink-selection"
"escape" = "editor.escape"
# Editing
"enter" = "editor.newline"
"shift-enter" = "editor.start-new-line"
"tab" = "editor.tab"
"shift-tab" = "editor.unindent"
"backspace" = "editor.backspace"
"shift-backspace" = "editor.backspace"
"delete" = "editor.delete"
"ctrl-backspace" = "editor.delete-word-left"
"ctrl-delete" = "editor.delete-word-right"
"ctrl-y" = "editor.delete-line"
"ctrl-d" = "editor.duplicate"
"alt-shift-up" = "editor.move-line-up"
"alt-shift-down" = "editor.move-line-down"
"ctrl-shift-up" = "editor.move-statement-up"
"ctrl-shift-down" = "editor.move-statement-down"
"ctrl-shift-j" = "editor.join-lines"
"ctrl-/" = "editor.toggle-comment"
"ctrl-z" = "editor.undo"
"alt-backspace" = "editor.undo"
"ctrl-shift-z" = "editor.redo"
"alt-shift-backspace" = "editor.redo"
# Clipboard
"ctrl-c" = "editor.copy"
"ctrl-insert" = "editor.copy"
"ctrl-x" = "editor.cut"
"shift-delete" = "editor.cut"
"ctrl-v" = "editor.paste"
"shift-insert" = "editor.paste"
# Find and replace
"ctrl-f" = "find.open"
"alt-f3" = "find.open"
"ctrl-r" = "find.replace"
"f3" = "find.next"
"ctrl-l" = "find.next"
"shift-f3" = "find.previous"
"ctrl-shift-l" = "find.previous"
# Problems
"f2" = "code.next-problem"
"shift-f2" = "code.previous-problem"
# Code completion
"ctrl-space" = "code.complete"

# Documentation, parameter info, the problems and actions at the caret,
# navigation and formatting. The documentation and parameter info popups
# leave the focus in the editor; Escape closes them (the completion
# popup's section comes later, so its Escape wins while it shows).
[[context]]
name = "Editor"
[context.bindings]
"ctrl-q" = "code.quick-doc"
"ctrl-p" = "code.parameter-info"
"ctrl-f1" = "code.error-description"
"alt-shift-enter" = "code.apply-first-fix"
"alt-enter" = "code.show-intentions"
"ctrl-b" = "code.go-to-declaration"
"ctrl-alt-f7" = "code.show-usages"
"ctrl-alt-l" = "code.reformat"
"ctrl-alt-o" = "code.optimize-imports"

[[context]]
name = "ParameterInfo > Editor"
[context.bindings]
"escape" = "parameter-info.close"

[[context]]
name = "Documentation > Editor"
[context.bindings]
"escape" = "documentation.close"

# Version control: Next and Previous Change move the caret to the changed
# lines and show their popup; Rollback Lines puts the committed text back.
# While the marker popup shows, Show Diff for Lines takes the key of
# Duplicate Line and Escape closes the popup.
[[context]]
name = "Editor"
[context.bindings]
"ctrl-alt-shift-down" = "vcs.next-change"
"ctrl-alt-shift-up" = "vcs.previous-change"
"ctrl-alt-z" = "vcs.rollback-lines"

[[context]]
name = "LineStatusPopup > Editor"
[context.bindings]
"ctrl-d" = "vcs.show-diff-lines"
"escape" = "marker-popup.close"

# Breakpoints (#164): Toggle Line Breakpoint at the caret, Toggle
# Temporary Line Breakpoint and View Breakpoints; in the editor the same
# key edits the breakpoint at the caret (`EditBreakpoint`, its properties
# popup; the dialog when the line has none). Mute Breakpoints and Toggle
# Breakpoint Enabled have no key.
[[context]]
[context.bindings]
"ctrl-f8" = "debug.toggle-breakpoint"
"ctrl-alt-shift-f8" = "debug.toggle-temporary-breakpoint"
"ctrl-shift-f8" = "debug.view-breakpoints"

[[context]]
name = "Editor"
[context.bindings]
"ctrl-shift-f8" = "debug.edit-breakpoint"

# Debugging (#165): Debug, the Debug tool window, Resume, the steps, Run
# to Cursor and Show Execution Point (`Debug`, `ActivateDebugToolWindow`,
# `Resume`, `StepOver`, `StepInto`, `StepIntoMyCode`, `StepOut`,
# `RunToCursor`, `ForceRunToCursor`, `ShowExecutionPoint`). Debug Context
# Configuration (`DebugClass`) and Pause have no key in this keymap.
[[context]]
[context.bindings]
"shift-f9" = "debug.debug"
"alt-5" = "workbench.toggle-debug"
"f9" = "debug.resume"
"f8" = "debug.step-over"
"f7" = "debug.step-into"
"alt-shift-f7" = "debug.step-into-my-code"
"shift-f8" = "debug.step-out"
"alt-f9" = "debug.run-to-cursor"
"ctrl-alt-f9" = "debug.force-run-to-cursor"
"alt-f10" = "debug.show-execution-point"

# Branches (#28): New Branch (`Git.CreateNewBranch`) and the Branches
# popup (`Git.Branches`). In the popup Up and Down move, Left and Right
# collapse and expand (Right opens a branch's actions), Enter chooses,
# Escape clears the search, then closes; Backspace and Delete delete a
# character of the search, else the selected branch; F2 and Shift+F6
# rename it.
[[context]]
[context.bindings]
"ctrl-alt-n" = "git.new-branch"
"ctrl-shift-`" = "vcs.branches-popup"

[[context]]
name = "BranchesPopup"
[context.bindings]
"up" = "branches-popup.up"
"down" = "branches-popup.down"
"left" = "branches-popup.left"
"right" = "branches-popup.right"
"enter" = "branches-popup.confirm"
"escape" = "branches-popup.close"
"backspace" = "branches-popup.delete"
"delete" = "branches-popup.delete"
"f2" = "branches-popup.rename"
"shift-f6" = "branches-popup.rename"

# The New Branch, Rename Branch and Checkout dialogs.
[[context]]
name = "BranchDialog > Editor"
[context.bindings]
"enter" = "branch-dialog.confirm"
"escape" = "branch-dialog.cancel"

# Commit (#170): Commit... opens the Commit tool window with every
# change included and the focus in the message (`CheckinProject`);
# Alt+0 shows or hides the tool window (`ActivateCommitToolWindow`);
# Commit and Push... and Add to VCS.
[[context]]
[context.bindings]
"ctrl-k" = "vcs.commit"
"alt-0" = "workbench.toggle-commit"
"ctrl-alt-k" = "vcs.commit.push"
"ctrl-alt-a" = "vcs.add"

# Rollback... in the main window's context, so that an editor's Rollback
# Lines (a deeper context) keeps the key.
[[context]]
name = "Workbench"
[context.bindings]
"ctrl-alt-z" = "vcs.rollback"

# In the Commit tool window Ctrl+Enter presses the commit button, Alt+M
# is the Amend check box's mnemonic and Ctrl+O opens the commit options.
[[context]]
name = "CommitToolWindow"
[context.bindings]
"ctrl-enter" = "vcs.commit.run"
"alt-m" = "vcs.commit.toggle-amend"
"ctrl-o" = "vcs.commit.options"

# The changes tree: Up and Down move, Left and Right collapse and expand,
# Space ticks or unticks the selected rows, Enter and Ctrl+D open the
# diff (the file without a diff viewer), F4 opens the file.
[[context]]
name = "CommitTree"
[context.bindings]
"up" = "commit-tree.up"
"down" = "commit-tree.down"
"left" = "commit-tree.left"
"right" = "commit-tree.right"
"space" = "commit-tree.toggle"
"enter" = "commit-tree.open"
"ctrl-d" = "commit-tree.show-diff"
"f4" = "commit-tree.jump-to-source"

# The diff viewer (#171): Next and Previous Difference (pressed again at
# the last or the first one: the next or the previous file), Compare Next
# and Previous File, Select Opposite Diff Pane and Jump to Source.
[[context]]
name = "Diff"
[context.bindings]
"f7" = "diff.next"
"shift-f7" = "diff.previous"
"alt-shift-right" = "diff.next-file"
"alt-shift-left" = "diff.previous-file"
"ctrl-shift-tab" = "diff.focus-opposite"
"f4" = "diff.jump-to-source"

# The commit options popup, the Rollback Changes and Git User Name Is Not
# Defined dialogs.
[[context]]
name = "CommitOptions > Editor"
[context.bindings]
"escape" = "commit-options.close"

[[context]]
name = "RollbackDialog"
[context.bindings]
"enter" = "rollback-dialog.confirm"
"escape" = "rollback-dialog.cancel"

[[context]]
name = "UserNameDialog > Editor"
[context.bindings]
"enter" = "user-name-dialog.confirm"
"escape" = "user-name-dialog.cancel"
"tab" = "user-name-dialog.next-field"

# Push, Update Project and the VCS Operations popup (#172): `Vcs.Push`,
# `Vcs.UpdateProject` and `Vcs.QuickListPopupAction`. In the Push dialog
# Enter pushes, Escape closes it, Up and Down move in the push log; in the
# field of the target branch Enter keeps the name and Escape restores it.
# In the Update Project dialog Enter chooses OK and Escape cancels.
[[context]]
[context.bindings]
"ctrl-shift-k" = "vcs.push"
"ctrl-t" = "vcs.update-project"
"alt-`" = "vcs.operations-popup"

[[context]]
name = "PushDialog"
[context.bindings]
"enter" = "push-dialog.push"
"escape" = "push-dialog.cancel"
"up" = "push-dialog.up"
"down" = "push-dialog.down"

[[context]]
name = "PushDialog > Editor"
[context.bindings]
"enter" = "push-dialog.confirm-target"
"escape" = "push-dialog.cancel-target"

[[context]]
name = "UpdateDialog"
[context.bindings]
"enter" = "update-dialog.ok"
"escape" = "update-dialog.cancel"

# The completion popup leaves the focus in the editor; while it shows,
# Enter inserts the selected item, Tab replaces the identifier at the
# caret with it, Escape closes it, and the keys that move the caret up
# and down move the selection (the reference's lookup handles the editor
# actions Up, Down, Page Up and Page Down this way).
[[context]]
name = "Completion > Editor"
[context.bindings]
"enter" = "completion.accept"
"tab" = "completion.replace"
"escape" = "completion.cancel"
"up" = "completion.select-previous"
"down" = "completion.select-next"
"pageup" = "completion.page-up"
"pagedown" = "completion.page-down"

# The Go to Line field is a one-line editor: Enter and Escape close it.
[[context]]
name = "GoToLine > Editor"
[context.bindings]
"enter" = "go-to-line.confirm"
"escape" = "go-to-line.cancel"

# The find bar's fields are editors: Enter goes to the next match,
# Shift+Enter to the previous one; Down and Up do the same while the fields
# hold one line each and move the caret when they hold more;
# Ctrl+Shift+Enter breaks the line. Escape closes the bar, Ctrl+Enter goes
# back to the editor, Tab switches between the fields, Alt+Down shows the
# search history. The options and the buttons take the reference IDE's
# mnemonic keys (Alt with the letter).
[[context]]
name = "FindBar > Editor"
[context.bindings]
"enter" = "find.next"
"down" = "find.down"
"shift-enter" = "find.previous"
"up" = "find.up"
"escape" = "find.close"
"ctrl-enter" = "find.focus-editor"
"ctrl-shift-enter" = "find.new-line"
"tab" = "find.switch-field"
"shift-tab" = "find.switch-field"
"alt-down" = "find.show-history"
"alt-c" = "find.toggle-case"
"alt-w" = "find.toggle-words"
"alt-x" = "find.toggle-regex"
"ctrl-alt-e" = "find.toggle-in-selection"
"alt-p" = "find.replace-current"
"alt-a" = "find.replace-all"
"alt-l" = "find.exclude"

# Enter in the replace field replaces the current match.
[[context]]
name = "FindReplace > Editor"
[context.bindings]
"enter" = "find.replace-current"

# The search history below a field.
[[context]]
name = "FindHistory"
[context.bindings]
"up" = "find.history-up"
"down" = "find.history-down"
"enter" = "find.history-pick"
"escape" = "find.history-close"

# An open context menu (Swing popup menu keys of the reference IDE).
[[context]]
name = "ContextMenu"
[context.bindings]
"up" = "menu.up"
"down" = "menu.down"
"right" = "menu.open-submenu"
"left" = "menu.close-submenu"
"enter" = "menu.confirm"
"escape" = "menu.cancel"

# The Find in Files popup. In its fields Enter opens the selected result
# (Shift+Enter too) and Escape closes the popup; Up and Down (while the
# field holds one line), Page Up and Page Down and the Find Next and
# Previous keys move through the results; Tab and Shift+Tab go from field
# to field; Alt+Down shows the field's history. The options, the file
# mask, the scopes and Recursively take the reference IDE's mnemonic keys:
# Alt with the letter. In the preview, Enter, Tab and Alt+Down are the
# editor's, and F3, Ctrl+L, Shift+F3 and Ctrl+Shift+L its Find Next and Find
# Previous (below). F4 (Edit Source) opens the file: from the preview at its
# caret.
[[context]]
name = "FindInFiles > Editor"
[context.bindings]
"enter" = "find-in-files.open-result"
"shift-enter" = "find-in-files.open-result"
"escape" = "find-in-files.close"
"f3" = "find-in-files.next-result"
"ctrl-l" = "find-in-files.next-result"
"shift-f3" = "find-in-files.previous-result"
"ctrl-shift-l" = "find-in-files.previous-result"
"tab" = "find-in-files.next-field"
"shift-tab" = "find-in-files.previous-field"
"alt-down" = "find.show-history"
"alt-c" = "find.toggle-case"
"alt-w" = "find.toggle-words"
"alt-x" = "find.toggle-regex"
"alt-k" = "find-in-files.toggle-mask"
"alt-p" = "find-in-files.scope-project"
"alt-m" = "find-in-files.scope-module"
"alt-d" = "find-in-files.scope-directory"
"alt-s" = "find-in-files.scope-named"
"alt-y" = "find-in-files.toggle-recursive"
"f4" = "find-in-files.edit-source"

# Find Next and Find Previous in the preview are the editor's.
[[context]]
name = "FindInFilesPreview > Editor"
[context.bindings]
"f3" = "find.next"
"ctrl-l" = "find.next"
"shift-f3" = "find.previous"
"ctrl-shift-l" = "find.previous"

# The search and replace fields can hold several lines.
[[context]]
name = "FindInFilesQuery > Editor"
[context.bindings]
"down" = "find-in-files.down"
"up" = "find-in-files.up"
"pagedown" = "find-in-files.page-down"
"pageup" = "find-in-files.page-up"
"ctrl-shift-enter" = "find.new-line"

[[context]]
name = "FindInFilesReplace > Editor"
[context.bindings]
"down" = "find-in-files.down"
"up" = "find-in-files.up"
"ctrl-shift-enter" = "find.new-line"

# Replace in Files: Enter replaces the selected match, Shift+Alt+Enter
# replaces them all.
[[context]]
name = "ReplaceInFiles > Editor"
[context.bindings]
"enter" = "find-in-files.replace-selected"
"shift-enter" = "find-in-files.replace-selected"
"alt-shift-enter" = "find-in-files.replace-all"

# Shift+Enter in the folder field shows the folder chooser.
[[context]]
name = "FindInFilesDirectory > Editor"
[context.bindings]
"shift-enter" = "find-in-files.browse-directory"

# Search Everywhere: Tab and Shift+Tab (and Alt+Right and Alt+Left) switch
# tabs, Up and Down move through the results (round), Page Up and
# Ctrl+Up go to the first, Page Down and Ctrl+Down to the last; Alt+Up and
# Alt+Down go through the tab's searches. Enter opens or runs the selected
# result (Shift+Enter too). Alt+N includes non-project items.
[[context]]
name = "SearchEverywhere > Editor"
[context.bindings]
"tab" = "search-everywhere.next-tab"
"shift-tab" = "search-everywhere.previous-tab"
"alt-right" = "search-everywhere.next-tab"
"alt-left" = "search-everywhere.previous-tab"
"down" = "search-everywhere.down"
"up" = "search-everywhere.up"
"pagedown" = "search-everywhere.next-group"
"ctrl-down" = "search-everywhere.next-group"
"pageup" = "search-everywhere.previous-group"
"ctrl-up" = "search-everywhere.previous-group"
"enter" = "search-everywhere.select"
"shift-enter" = "search-everywhere.select"
"escape" = "search-everywhere.close"
"alt-up" = "search-everywhere.history-previous"
"alt-down" = "search-everywhere.history-next"
"alt-n" = "search-everywhere.toggle-everywhere"
# The scope list's mnemonics: O chooses, P toggles.
"alt-o" = "search-everywhere.choose-scope"
"alt-p" = "search-everywhere.toggle-everywhere"

# The Text tab's options: Alt with the letter.
[[context]]
name = "SearchEverywhereText > Editor"
[context.bindings]
"alt-c" = "search-everywhere.toggle-case"
"alt-w" = "search-everywhere.toggle-words"
"alt-x" = "search-everywhere.toggle-regex"

# Recent Files: Up and Down (round), Left and Right between the tool
# windows and the files, Enter opens, Escape clears the speed search or
# closes, Delete and Backspace take a file off the list (or a char off the
# speed search).
[[context]]
name = "RecentFiles"
[context.bindings]
"up" = "recent-files.up"
"down" = "recent-files.down"
"left" = "recent-files.left"
"right" = "recent-files.right"
"enter" = "recent-files.select"
"escape" = "recent-files.close"
"delete" = "recent-files.delete"
"backspace" = "recent-files.delete"

# The Run tool window: Rerun, Close Tab, Up and Down the Stack Trace;
# Escape goes to the editor, Shift+Escape hides the tool window. (A
# binding without a context counts as one of the innermost context, so
# these sections come last; the console, an editor, repeats the keys that
# the editor or the whole window bind.)
[[context]]
name = "RunToolWindow"
[context.bindings]
"ctrl-f5" = "run.rerun"
"ctrl-f4" = "run.close-tab"
"ctrl-alt-up" = "run.console.previous-link"
"ctrl-alt-down" = "run.console.next-link"
"escape" = "workbench.focus-editor"
"shift-escape" = "workbench.hide-tool-window"

# The Debug tool window and its Console: Rerun, Stop and Close Tab of the
# session; Escape goes to the editor, Shift+Escape hides the tool window.
[[context]]
name = "DebugToolWindow"
[context.bindings]
"ctrl-f5" = "debug.rerun"
"ctrl-f2" = "debug.stop"
"ctrl-f4" = "debug.close-tab"
"escape" = "workbench.focus-editor"
"shift-escape" = "workbench.hide-tool-window"

[[context]]
name = "DebugConsole > Editor"
[context.bindings]
"ctrl-f2" = "debug.stop"
"ctrl-f4" = "debug.close-tab"
"escape" = "workbench.focus-editor"

# The Run console: Close Tab and Send EOF take the keys of Close and
# Duplicate Line; Escape leaves it.
[[context]]
name = "RunConsole > Editor"
[context.bindings]
"ctrl-f4" = "run.close-tab"
"ctrl-d" = "run.console.send-eof"
"escape" = "workbench.focus-editor"

# A message dialog: Enter chooses the default button, Escape cancels.
[[context]]
name = "Dialog"
[context.bindings]
"enter" = "dialog.confirm"
"escape" = "dialog.cancel"

# The Run/Debug Configurations dialog: Enter is OK, Escape Cancel, Alt+M
# opens Modify options, Alt with an option's mnemonic turns it on or off
# (Allow m&ultiple instances, &Environment variables, &Paths to ".env"
# files); also in its fields, which are editors.
[[context]]
name = "RunConfigurationsDialog"
[context.bindings]
"alt-u" = { command = "run.configurations.dialog.toggle-option", args = { option = "allow-parallel" } }
"alt-e" = { command = "run.configurations.dialog.toggle-option", args = { option = "env" } }
"alt-p" = { command = "run.configurations.dialog.toggle-option", args = { option = "env-files" } }
"enter" = "run.configurations.dialog.ok"
"escape" = "run.configurations.dialog.cancel"
"alt-m" = "run.configurations.dialog.modify-options"

[[context]]
name = "RunConfigurationsDialog > Editor"
[context.bindings]
"alt-u" = { command = "run.configurations.dialog.toggle-option", args = { option = "allow-parallel" } }
"alt-e" = { command = "run.configurations.dialog.toggle-option", args = { option = "env" } }
"alt-p" = { command = "run.configurations.dialog.toggle-option", args = { option = "env-files" } }
"enter" = "run.configurations.dialog.ok"
"escape" = "run.configurations.dialog.cancel"
"alt-m" = "run.configurations.dialog.modify-options"

# Its tree: Up and Down move, Left and Right collapse and expand; Alt+Insert
# adds, Delete removes and Ctrl+D copies a configuration
# (`CommonShortcuts.getInsert`, `getDelete`, `getDuplicate`).
[[context]]
name = "RunConfigurationsTree"
[context.bindings]
"up" = "run.configurations.dialog.previous"
"down" = "run.configurations.dialog.next"
"alt-insert" = "run.configurations.dialog.add"
"delete" = "run.configurations.dialog.remove"
"ctrl-d" = "run.configurations.dialog.copy"
"left" = "run.configurations.dialog.collapse"
"right" = "run.configurations.dialog.expand"

# An option tag under its form: Backspace removes the option (`TagButton`).
[[context]]
name = "RunConfigurationsTag"
[context.bindings]
"backspace" = "run.configurations.dialog.remove-tag"

# The name field of New File, New Directory and Rename (#37).
[[context]]
name = "NameInput > Editor"
[context.bindings]
"enter" = "name-input.confirm"
"escape" = "name-input.cancel"
"down" = "name-input.next-kind"
"up" = "name-input.previous-kind"
"tab" = "name-input.next-field"
"shift-tab" = "name-input.previous-field"

# The Settings window: Enter is OK, Escape clears the search, else
# Cancel (`SettingsDialog`, `SettingsEditor.cancel`), in its fields too;
# Find goes to the search field, Back and Forward to the pages selected
# before (`SettingsNonModalDialog`, `SettingsEditor` history toolbar).
[[context]]
name = "SettingsWindow"
[context.bindings]
"enter" = "settings.ok"
"escape" = "settings.escape"
"ctrl-f" = "settings.find"
"ctrl-alt-left" = "settings.back"
"ctrl-alt-right" = "settings.forward"

[[context]]
name = "SettingsWindow > Editor"
[context.bindings]
"enter" = "settings.ok"
"escape" = "settings.escape"
"ctrl-f" = "settings.find"

# The page tree (`TreeUtil.installActions`).
[[context]]
name = "SettingsTree"
[context.bindings]
"up" = "settings.select-previous"
"down" = "settings.select-next"
"left" = "settings.collapse"
"right" = "settings.expand"

# The search field: Up and Down move the tree's selection, Enter goes to
# the page (`SettingsSearch`, `SettingsEditor`).
[[context]]
name = "SettingsSearch > Editor"
[context.bindings]
"up" = "settings.select-previous"
"down" = "settings.select-next"
"enter" = "settings.go-to-page"

# The breakpoint properties popup: Escape, Enter and Ctrl+Enter close it
# (Done), the key of View Breakpoints opens the dialog (More), also in its
# condition field (`BreakpointEditor`).
[[context]]
name = "BreakpointPopup"
[context.bindings]
"escape" = "breakpoint-popup.done"
"enter" = "breakpoint-popup.done"
"ctrl-enter" = "breakpoint-popup.done"
"ctrl-shift-f8" = "breakpoint-popup.more"

[[context]]
name = "BreakpointPopup > Editor"
[context.bindings]
"escape" = "breakpoint-popup.done"
"enter" = "breakpoint-popup.done"
"ctrl-enter" = "breakpoint-popup.done"
"ctrl-shift-f8" = "breakpoint-popup.more"

# The Breakpoints dialog: Escape is Done, in its fields too; in its tree
# Up and Down move, Space turns the selected breakpoint on or off, Delete
# removes it, Enter and Jump to Source open its line (`BreakpointsDialog`,
# `CheckboxTree`).
[[context]]
name = "BreakpointsDialog"
[context.bindings]
"escape" = "breakpoints-dialog.done"

[[context]]
name = "BreakpointsDialog > Editor"
[context.bindings]
"escape" = "breakpoints-dialog.done"

[[context]]
name = "BreakpointsTree"
[context.bindings]
"up" = "breakpoints-dialog.previous"
"down" = "breakpoints-dialog.next"
"space" = "breakpoints-dialog.toggle-enabled"
"delete" = "breakpoints-dialog.remove"
"enter" = "breakpoints-dialog.go-to-source"
"f4" = "breakpoints-dialog.go-to-source"

# A focused terminal (the reference's `Terminal.*` actions): Copy only
# with a selection (without one Ctrl+C goes to the shell), Paste
# (bracketed when the program asked for it), Line Up and Down, Page Up
# and Down. Ctrl+A and Ctrl+K stay the shell's.
[[context]]
name = "Terminal"
[context.bindings]
"ctrl-c" = "terminal.copy"
"ctrl-insert" = "terminal.copy"
"ctrl-v" = "terminal.paste"
"shift-insert" = "terminal.paste"
"ctrl-up" = "terminal.line-up"
"ctrl-down" = "terminal.line-down"
"shift-pageup" = "terminal.page-up"
"shift-pagedown" = "terminal.page-down"

# The first-run window (`OnboardingDialog`, a `DialogWrapper`): Enter is
# its default button (Continue), Escape closes it.
[[context]]
name = "FirstRun"
[context.bindings]
"enter" = "first-run.continue"
"escape" = "first-run.cancel"
