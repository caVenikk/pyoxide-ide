# Pyoxide keymap for Windows and Linux. Find: the find bar, Replace and the
# search history.
# Keystrokes follow the reference IDE's default keymap (Apache-2.0, see
# NOTICE).

[[context]]
name = "Editor"
[context.bindings]
# Find and replace
"ctrl-f" = "find.open"
"alt-f3" = "find.open"
"ctrl-r" = "find.replace"
"f3" = "find.next"
"ctrl-l" = "find.next"
"shift-f3" = "find.previous"
"ctrl-shift-l" = "find.previous"

# The find bar's fields are editors: Enter goes to the next match,
# Shift+Enter to the previous one; Down and Up do the same while the fields
# hold one line each and move the caret when they hold more;
# Ctrl+Shift+Enter breaks the line. Escape closes the bar, Ctrl+Enter goes
# back to the editor, Tab switches between the fields, Alt+Down shows the
# search history. The options and the buttons take the reference IDE's
# mnemonic keys (Alt with the letter).
[[context]]
name = "FindBar > Editor"
[context.bindings]
"enter" = "find.next"
"down" = "find.down"
"shift-enter" = "find.previous"
"up" = "find.up"
"escape" = "find.close"
"ctrl-enter" = "find.focus-editor"
"ctrl-shift-enter" = "find.new-line"
"tab" = "find.switch-field"
"shift-tab" = "find.switch-field"
"alt-down" = "find.show-history"
"alt-c" = "find.toggle-case"
"alt-w" = "find.toggle-words"
"alt-x" = "find.toggle-regex"
"ctrl-alt-e" = "find.toggle-in-selection"
"alt-p" = "find.replace-current"
"alt-a" = "find.replace-all"
"alt-l" = "find.exclude"

# Enter in the replace field replaces the current match.
[[context]]
name = "FindReplace > Editor"
[context.bindings]
"enter" = "find.replace-current"

# The search history below a field.
[[context]]
name = "FindHistory"
[context.bindings]
"up" = "find.history-up"
"down" = "find.history-down"
"enter" = "find.history-pick"
"escape" = "find.history-close"
