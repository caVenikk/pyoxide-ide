# Pyoxide keymap for Windows and Linux. Code insight: documentation,
# parameter info, problems, intentions and fixes, navigation to declarations
# and usages, reformatting and imports.
# Keystrokes follow the reference IDE's default keymap (Apache-2.0, see
# NOTICE).

# The problems, documentation, parameter info and the actions at the
# caret, navigation and formatting.
[[context]]
name = "Editor"
[context.bindings]
# Problems
"f2" = "code.next-problem"
"shift-f2" = "code.previous-problem"
# Documentation, parameter info, actions at the caret, navigation and
# formatting
"ctrl-q" = "code.quick-doc"
"ctrl-p" = "code.parameter-info"
"ctrl-f1" = "code.error-description"
"alt-shift-enter" = "code.apply-first-fix"
"alt-enter" = "code.show-intentions"
"ctrl-b" = "code.go-to-declaration"
"ctrl-alt-f7" = "code.show-usages"
"ctrl-alt-l" = "code.reformat"
"ctrl-alt-o" = "code.optimize-imports"

# The documentation and parameter info popups leave the focus in the
# editor; Escape closes them (completion.toml is joined later, so the
# completion popup's Escape wins while it shows).
[[context]]
name = "ParameterInfo > Editor"
[context.bindings]
"escape" = "parameter-info.close"

[[context]]
name = "Documentation > Editor"
[context.bindings]
"escape" = "documentation.close"
# The documentation popup's Jump to Source and View External Documentation
# take the shortcuts of EditSource and ExternalJavaDoc.
"f4" = "documentation.edit-source"
"shift-f1" = "documentation.view-external"
