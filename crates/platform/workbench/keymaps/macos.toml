# Default keymap of Pyoxide on macOS. Keystrokes follow the reference IDE's
# default macOS keymap (IntelliJ Platform Community keymap files,
# Apache-2.0, see NOTICE); commands are Pyoxide's own (ADR 0007).
#
# A section applies where its key context matches (GPUI predicates); a
# deeper context wins, and of two bindings for the same context the later
# one wins.

[[context]]
[context.bindings]
"cmd-q" = "app.quit"
"cmd-1" = "workbench.toggle-project"
"cmd-s" = "workbench.save-all"
"cmd-w" = "tabs.close"
"cmd-}" = "tabs.next"
"ctrl-right" = "tabs.next"
"cmd-{" = "tabs.previous"
"ctrl-left" = "tabs.previous"

[[context]]
name = "ProjectTree"
[context.bindings]
"up" = "project.tree.up"
"down" = "project.tree.down"
"right" = "project.tree.expand"
"left" = "project.tree.collapse"
"enter" = "project.tree.open"
"cmd-down" = "project.tree.open"
"f4" = "project.tree.open"
"cmd--" = "project.tree.collapse-all"
"cmd-=" = "project.tree.expand-all"
"escape" = "workbench.focus-editor"
"shift-escape" = "workbench.hide-tool-window"

[[context]]
name = "Editor"
[context.bindings]
# Caret movement
"left" = "editor.move-left"
"ctrl-b" = "editor.move-left"
"right" = "editor.move-right"
"ctrl-f" = "editor.move-right"
"up" = "editor.move-up"
"ctrl-p" = "editor.move-up"
"down" = "editor.move-down"
"ctrl-n" = "editor.move-down"
"alt-left" = "editor.move-word-left"
"ctrl-alt-b" = "editor.move-word-left"
"alt-right" = "editor.move-word-right"
"ctrl-alt-f" = "editor.move-word-right"
"home" = "editor.move-line-start"
"cmd-left" = "editor.move-line-start"
"ctrl-a" = "editor.move-line-start"
"end" = "editor.move-line-end"
"cmd-right" = "editor.move-line-end"
"ctrl-e" = "editor.move-line-end"
"cmd-home" = "editor.move-document-start"
"cmd-end" = "editor.move-document-end"
"pageup" = "editor.page-up"
"pagedown" = "editor.page-down"
"cmd-l" = "workbench.go-to-line"
# Selection
"shift-left" = "editor.select-left"
"shift-right" = "editor.select-right"
"shift-up" = "editor.select-up"
"shift-down" = "editor.select-down"
"alt-shift-left" = "editor.select-word-left"
"ctrl-alt-shift-b" = "editor.select-word-left"
"alt-shift-right" = "editor.select-word-right"
"ctrl-alt-shift-f" = "editor.select-word-right"
"shift-home" = "editor.select-line-start"
"cmd-shift-left" = "editor.select-line-start"
"shift-end" = "editor.select-line-end"
"cmd-shift-right" = "editor.select-line-end"
"cmd-shift-home" = "editor.select-document-start"
"cmd-shift-end" = "editor.select-document-end"
"shift-pageup" = "editor.select-page-up"
"shift-pagedown" = "editor.select-page-down"
"cmd-a" = "editor.select-all"
"alt-up" = "editor.select-word"
"alt-down" = "editor.shrink-selection"
"escape" = "editor.escape"
# Editing
"enter" = "editor.newline"
"shift-enter" = "editor.start-new-line"
"tab" = "editor.tab"
"shift-tab" = "editor.unindent"
"backspace" = "editor.backspace"
"shift-backspace" = "editor.backspace"
"delete" = "editor.delete"
"alt-backspace" = "editor.delete-word-left"
"alt-delete" = "editor.delete-word-right"
"cmd-backspace" = "editor.delete-line"
"cmd-d" = "editor.duplicate"
"alt-shift-up" = "editor.move-line-up"
"alt-shift-down" = "editor.move-line-down"
"cmd-shift-up" = "editor.move-statement-up"
"cmd-shift-down" = "editor.move-statement-down"
"ctrl-shift-j" = "editor.join-lines"
"cmd-/" = "editor.toggle-comment"
"cmd-z" = "editor.undo"
"cmd-shift-z" = "editor.redo"
"alt-shift-backspace" = "editor.redo"
# Clipboard
"cmd-c" = "editor.copy"
"cmd-insert" = "editor.copy"
"cmd-x" = "editor.cut"
"shift-delete" = "editor.cut"
"cmd-v" = "editor.paste"
"shift-insert" = "editor.paste"
# Find and replace
"cmd-f" = "find.open"
"cmd-r" = "find.replace"
"cmd-g" = "find.next"
"cmd-shift-g" = "find.previous"

# The Go to Line field is a one-line editor: Enter and Escape close it.
[[context]]
name = "GoToLine > Editor"
[context.bindings]
"enter" = "go-to-line.confirm"
"escape" = "go-to-line.cancel"

# The find bar's fields are editors: Enter goes to the next match,
# Shift+Enter to the previous one; Down and Ctrl+N, Up and Ctrl+P do the same
# while the fields hold one line each and move the caret when they hold more;
# Cmd+Shift+Enter breaks the line. Escape closes the bar, Cmd+Enter goes back
# to the editor, Tab switches between the fields, Option+Down shows the
# search history. The options take the reference IDE's mnemonic keys:
# Ctrl+Option and, as it also accepts on macOS, Option with the letter; the
# buttons take Ctrl+Option with theirs.
[[context]]
name = "FindBar > Editor"
[context.bindings]
"enter" = "find.next"
"down" = "find.down"
"ctrl-n" = "find.down"
"shift-enter" = "find.previous"
"up" = "find.up"
"ctrl-p" = "find.up"
"escape" = "find.close"
"cmd-enter" = "find.focus-editor"
"cmd-shift-enter" = "find.new-line"
"tab" = "find.switch-field"
"shift-tab" = "find.switch-field"
"alt-down" = "find.show-history"
"ctrl-alt-c" = "find.toggle-case"
"alt-c" = "find.toggle-case"
"ctrl-alt-w" = "find.toggle-words"
"alt-w" = "find.toggle-words"
"ctrl-alt-x" = "find.toggle-regex"
"alt-x" = "find.toggle-regex"
"ctrl-alt-e" = "find.toggle-in-selection"
"ctrl-alt-p" = "find.replace-current"
"ctrl-alt-a" = "find.replace-all"
"ctrl-alt-l" = "find.exclude"

# Enter in the replace field replaces the current match.
[[context]]
name = "FindReplace > Editor"
[context.bindings]
"enter" = "find.replace-current"

# The search history below a field.
[[context]]
name = "FindHistory"
[context.bindings]
"up" = "find.history-up"
"down" = "find.history-down"
"enter" = "find.history-pick"
"escape" = "find.history-close"

# An open context menu (Swing popup menu keys of the reference IDE).
[[context]]
name = "ContextMenu"
[context.bindings]
"up" = "menu.up"
"down" = "menu.down"
"right" = "menu.open-submenu"
"left" = "menu.close-submenu"
"enter" = "menu.confirm"
"escape" = "menu.cancel"
