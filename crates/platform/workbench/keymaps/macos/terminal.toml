# Pyoxide keymap for macOS. Terminal: the Terminal tool window and the keys
# of a focused terminal.
# Keystrokes follow the reference IDE's macOS keymap (Apache-2.0, see
# NOTICE).

# The Terminal tool window (`ActivateTerminalToolWindow`).
[[context]]
[context.bindings]
"alt-f12" = "workbench.toggle-terminal"

# A focused terminal (the reference's `Terminal.*` actions): Copy only
# with a selection (without one the key goes on), Paste (bracketed when
# the program asked for it), Select All, Clear Terminal (the prompt line
# stays), Line Up and Down, Page Up and Down.
[[context]]
name = "Terminal"
[context.bindings]
"cmd-c" = "terminal.copy"
"cmd-v" = "terminal.paste"
"cmd-a" = "terminal.select-all"
"cmd-k" = "terminal.clear"
"cmd-up" = "terminal.line-up"
"cmd-down" = "terminal.line-down"
"shift-pageup" = "terminal.page-up"
"shift-pagedown" = "terminal.page-down"
# The tabs of the Terminal tool window (`Terminal.NewTab`,
# `Terminal.CloseTab`, `NextTab`, `PreviousTab`, `ShowContent`) and Hide;
# Escape goes to the shell. (Bound in the terminal's own context: a
# binding without a context counts as one of the innermost context, see
# run.toml.)
"cmd-t" = "terminal.new-tab"
"cmd-w" = "terminal.close-tab"
"cmd-}" = "terminal.next-tab"
"cmd-{" = "terminal.previous-tab"
"ctrl-shift-down" = "terminal.show-tab-list"
"shift-escape" = "workbench.hide-tool-window"

# The rename balloon of a tab (`ToolWindowTabRenameActionBase`): Enter
# renames (an empty name is refused), Escape cancels.
[[context]]
name = "TerminalRename > Editor"
[context.bindings]
"enter" = "terminal.rename-confirm"
"escape" = "terminal.rename-cancel"
