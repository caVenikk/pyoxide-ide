# Pyoxide keymap for macOS. Debug: starting a session, the steps, the Debug
# tool window, the frames and the variables.
# Keystrokes follow the reference IDE's macOS keymap (Apache-2.0, see
# NOTICE).

# Debugging (#165): Debug, Debug Context Configuration, the Debug tool
# window, Resume, the steps, Run to Cursor and Show Execution Point
# (`Debug`, `DebugClass`, `ActivateDebugToolWindow`, `Resume`,
# `StepOver`, `StepInto`, `StepIntoMyCode`, `StepOut`, `RunToCursor`,
# `ForceRunToCursor`, `ShowExecutionPoint`). Pause has no key.
[[context]]
[context.bindings]
"ctrl-d" = "debug.debug"
"ctrl-shift-d" = "debug.current-file"
"cmd-5" = "workbench.toggle-debug"
"cmd-alt-r" = "debug.resume"
"f9" = "debug.resume"
"f8" = "debug.step-over"
"f7" = "debug.step-into"
"alt-shift-f7" = "debug.step-into-my-code"
"shift-f8" = "debug.step-out"
"alt-f9" = "debug.run-to-cursor"
"cmd-alt-f9" = "debug.force-run-to-cursor"
"alt-f10" = "debug.show-execution-point"
# Evaluate Expression (`EvaluateExpression`) opens the Evaluate dialog from the
# editor and from the variables alike.
"alt-f8" = "debug.evaluate-expression"

# Threads & Variables (#166): Previous and Next Frame from anywhere while
# debugging (`PreviousOccurence`, `NextOccurence` over the frames list,
# `XFramesView.addFramesNavigationAd`), in the main window's context so
# that the Run console's links (a deeper context) keep the keys. In the
# frames list Up and Down select frames; in the variables view they move,
# Left and Right collapse and expand.
[[context]]
name = "Workbench"
[context.bindings]
"cmd-alt-up" = "debug.previous-frame"
"cmd-alt-down" = "debug.next-frame"

# The Debug tool window (its Console is in console.toml): Rerun, Stop and
# Close Tab of the session; Escape goes to the editor, Shift+Escape hides
# the tool window.
[[context]]
name = "DebugToolWindow"
[context.bindings]
"cmd-r" = "debug.rerun"
"cmd-f2" = "debug.stop"
"cmd-w" = "debug.close-tab"
"escape" = "workbench.focus-editor"
"shift-escape" = "workbench.hide-tool-window"

[[context]]
name = "DebugFrames"
[context.bindings]
"up" = "debug.previous-frame"
"down" = "debug.next-frame"

[[context]]
name = "DebugVariables"
[context.bindings]
"up" = "debug.variables.up"
"down" = "debug.variables.down"
"left" = "debug.variables.left"
"right" = "debug.variables.right"
# The watches and the values (#166): New Watch (`XDebugger.NewWatch`),
# Remove Watch (`$Delete`), Set Value and Edit of a watch
# (`XDebugger.SetValue`), Copy Value (`$Copy`), Jump To Source
# (`EditSource`) and Jump To Type Source (`XDebugger.JumpToTypeSource`).
"insert" = "debug.new-watch"
"backspace" = "debug.remove-watch"
"delete" = "debug.remove-watch"
"f2" = "debug.variables.set-value"
"cmd-c" = "debug.variables.copy-value"
"f4" = "debug.variables.jump-to-source"
"shift-f4" = "debug.variables.jump-to-type-source"

# Cmd+Down of Jump To Source on its own, after F4: a menu shows the binding
# added last, Cmd+Down as the reference (a block's bindings are added in
# the order of their keys).
[[context]]
name = "DebugVariables"
[context.bindings]
"cmd-down" = "debug.variables.jump-to-source"

# The evaluate field above the variables: Enter evaluates, Shift+Cmd+Enter
# adds the expression to the watches (`XWatchesViewImpl.createTopPanel`,
# `XDebuggerEvaluationDialog.getAddWatchKeystroke`).
[[context]]
name = "DebugEvaluate > Editor"
[context.bindings]
"enter" = "debug.variables.evaluate"
"cmd-shift-enter" = "debug.variables.watch-expression"

# A value or a watch edited in its row: Enter applies, Escape cancels.
[[context]]
name = "DebugValueEditor > Editor"
[context.bindings]
"enter" = "debug.variables.commit-edit"
"escape" = "debug.variables.cancel-edit"

# Values in the editor (#167): Quick Evaluate Expression
# (`QuickEvaluateExpression`) shows the value at the caret in a popup with
# its tree; Escape closes the popup (`XDebuggerTreePopup`).
[[context]]
[context.bindings]
"cmd-alt-f8" = "debug.quick-evaluate"

[[context]]
name = "DebugValuePopup"
[context.bindings]
"escape" = "debug.value-popup.close"

# The Evaluate dialog (#293, `XDebuggerEvaluationDialog`): Escape closes it
# (an open history list first), Cmd+Enter evaluates (the dialog's OK key;
# Enter in the one-line field too), Cmd+Shift+Enter adds the expression to
# the watches, Alt+M switches between the expression and the code fragment
# mode and Alt+R moves the focus to the result.
[[context]]
name = "EvaluateDialog"
[context.bindings]
"escape" = "evaluate-dialog.close"
"cmd-enter" = "evaluate-dialog.evaluate"
"cmd-shift-enter" = "evaluate-dialog.add-to-watches"
"alt-m" = "evaluate-dialog.switch-mode"
"alt-r" = "evaluate-dialog.focus-result"

[[context]]
name = "EvaluateDialog > Editor"
[context.bindings]
"escape" = "evaluate-dialog.close"
"cmd-enter" = "evaluate-dialog.evaluate"
"cmd-shift-enter" = "evaluate-dialog.add-to-watches"
"alt-m" = "evaluate-dialog.switch-mode"
"alt-r" = "evaluate-dialog.focus-result"

[[context]]
name = "EvaluateExpression > Editor"
[context.bindings]
"enter" = "evaluate-dialog.evaluate"
