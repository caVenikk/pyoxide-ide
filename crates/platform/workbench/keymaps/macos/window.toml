# Pyoxide keymap for macOS. Main window: quit, editor tabs, an open context
# menu and message dialogs.
# Keystrokes follow the reference IDE's macOS keymap (Apache-2.0, see
# NOTICE).

# Quit and the editor tabs.
[[context]]
[context.bindings]
"cmd-q" = "app.quit"
# The reference gets Hide and Hide Others from the macOS application menu.
"cmd-h" = "app.hide"
"cmd-alt-h" = "app.hide-others"
"cmd-m" = "window.minimize"
"cmd-ctrl-=" = "window.zoom"
"cmd-w" = "tabs.close"
"cmd-}" = "tabs.next"
"ctrl-right" = "tabs.next"
"cmd-{" = "tabs.previous"
"ctrl-left" = "tabs.previous"

# An open context menu (Swing popup menu keys of the reference IDE).
[[context]]
name = "ContextMenu"
[context.bindings]
"up" = "menu.up"
"down" = "menu.down"
"right" = "menu.open-submenu"
"left" = "menu.close-submenu"
"enter" = "menu.confirm"
"escape" = "menu.cancel"

# A message dialog: Enter chooses the default button, Escape cancels.
[[context]]
name = "Dialog"
[context.bindings]
"enter" = "dialog.confirm"
"escape" = "dialog.cancel"
