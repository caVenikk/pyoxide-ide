# Pyoxide keymap for macOS. Version control, commit: the Commit tool window,
# its tree, rollback and the commit dialogs.
# Keystrokes follow the reference IDE's macOS keymap (Apache-2.0, see
# NOTICE).

# Commit (#170): Commit... opens the Commit tool window with every
# change included and the focus in the message (`CheckinProject`);
# Command+0 shows or hides the tool window (`ActivateCommitToolWindow`);
# Commit and Push... and Add to VCS.
[[context]]
[context.bindings]
"cmd-k" = "vcs.commit"
"cmd-0" = "workbench.toggle-commit"
"cmd-alt-k" = "vcs.commit.push"
"cmd-alt-a" = "vcs.add"

# Rollback... in the main window's context, so that an editor's Rollback
# Lines (a deeper context) keeps the key.
[[context]]
name = "Workbench"
[context.bindings]
"cmd-alt-z" = "vcs.rollback"

# In the Commit tool window Command+Enter or Control+Enter presses the
# commit button, Control+Option+M is the Amend check box's mnemonic and
# Control+O opens the commit options.
[[context]]
name = "CommitToolWindow"
[context.bindings]
"cmd-enter" = "vcs.commit.run"
"ctrl-enter" = "vcs.commit.run"
"ctrl-alt-m" = "vcs.commit.toggle-amend"
"ctrl-o" = "vcs.commit.options"

# The changes tree: Up and Down move, Left and Right collapse and expand,
# Space ticks or unticks the selected rows, Enter and Command+D open the
# diff (the file without a diff viewer), F4 or Command+Down opens the file.
[[context]]
name = "CommitTree"
[context.bindings]
"up" = "commit-tree.up"
"down" = "commit-tree.down"
"left" = "commit-tree.left"
"right" = "commit-tree.right"
"space" = "commit-tree.toggle"
"enter" = "commit-tree.open"
"cmd-d" = "commit-tree.show-diff"
"f4" = "commit-tree.jump-to-source"
"cmd-down" = "commit-tree.jump-to-source"

# The commit options popup, the Rollback Changes and Git User Name Is Not
# Defined dialogs.
[[context]]
name = "CommitOptions > Editor"
[context.bindings]
"escape" = "commit-options.close"

[[context]]
name = "RollbackDialog"
[context.bindings]
"enter" = "rollback-dialog.confirm"
"escape" = "rollback-dialog.cancel"

[[context]]
name = "UserNameDialog > Editor"
[context.bindings]
"enter" = "user-name-dialog.confirm"
"escape" = "user-name-dialog.cancel"
"tab" = "user-name-dialog.next-field"
