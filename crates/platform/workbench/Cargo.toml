[package]
name = "workbench"
description = "Main window of Pyoxide IDE: toolbar, tool window stripes, project tool window, editor tabs, status bar, keymaps and application start-up"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The time of a notification in the Notifications tool window.
chrono.workspace = true
code-intel-ui.workspace = true
commands.workspace = true
console.workspace = true
debugger-ui.workspace = true
dirs = "7"
editor.workspace = true
file-index.workspace = true
file-watcher.workspace = true
futures = "0.3"
git.workspace = true
gpui.workspace = true
name-match.workspace = true
process.workspace = true
project.workspace = true
project-search.workspace = true
settings.workspace = true
settings-ui.workspace = true
regex.workspace = true
run-config.workspace = true
search.workspace = true
serde.workspace = true
serde_json.workspace = true
terminal.workspace = true
text.workspace = true
themes.workspace = true
toml.workspace = true
ui.workspace = true
vcs.workspace = true
vcs-ui.workspace = true

# Window screenshots (PYOXIDE_SHOT) ask the window server for an image of
# the app's own window; these crates are already in GPUI's dependency tree.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }
objc = "0.2"
raw-window-handle = "0.6"

[dev-dependencies]
code-intel = { workspace = true, features = ["fake"] }
dap-client = { workspace = true, features = ["fake"] }
debugger.workspace = true
gpui = { workspace = true, features = ["test-support"] }
# The list type of GPUI's `ExternalPaths` (tests/drop.rs).
smallvec = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["runtime_shaders", "test-support"] }
