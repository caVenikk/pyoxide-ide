[package]
name = "db-service"
description = "Database engine service for Pyoxide IDE: connection profiles, secrets, driver dispatch, diagnostics and the db.* commands"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
app-info.workspace = true
async-trait.workspace = true
commands.workspace = true
db-core.workspace = true
db-oracle-thin.workspace = true
db-oracle-odpi.workspace = true
db-postgres.workspace = true
db-sqlite.workspace = true
secrets.workspace = true
settings-import.workspace = true
dirs = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1"

[dev-dependencies]
tempfile = "3"
