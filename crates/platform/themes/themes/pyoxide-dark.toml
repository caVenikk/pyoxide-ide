# Pyoxide Dark: the default dark theme. The colours are original to this
# project (a cool grey-blue base with an oxidised copper accent).

[theme]
format = 1
id = "pyoxide-dark"
name = "Pyoxide Dark"
kind = "dark"
description = "Default dark theme"

[palette]
# Surfaces
bg-editor = "#15181d"
bg-deep = "#111418"
bg-panel = "#1b1f26"
bg-side = "#171b21"
bg-raised = "#252a33"
bg-hover = "#262c36"
bg-pressed = "#2f3640"
bg-selected = "#2d4560"
bg-selected-inactive = "#2a3340"
bg-current-line = "#1b2029"
line = "#2b313b"
line-strong = "#667286"
# Text
fg = "#d5dae2"
fg-bright = "#f1f4f8"
fg-muted = "#929cab"
fg-dim = "#6a7385"
fg-gutter = "#7b8597"
# Hues
copper = "#e0814a"
copper-soft = "#e58a5f"
copper-light = "#efa774"
gold = "#e6c36a"
sand = "#d9c7a6"
green = "#9bc97c"
leaf = "#7cc98a"
teal = "#55c9b8"
teal-light = "#8ed1c6"
cyan = "#6fc5e0"
blue = "#6fb1ff"
blue-code = "#79b4ff"
steel = "#b4cdee"
violet = "#c79df0"
rose = "#e07a9b"
red = "#f27775"
amber = "#e8b45a"

[ui]
surface = "$bg-panel"
surface-alt = "$bg-side"
surface-raised = "$bg-raised"
input = "$bg-deep"
border = "$line"
border-input = "$line-strong"
divider = "#262c35"
popup-border = "#3a414d"
text = "$fg"
text-muted = "$fg-muted"
text-disabled = "$fg-dim"
text-link = "$blue"
shortcut = "#b9c0cb"
accent = "$copper"
on-accent = "#1a110b"
focus = "$copper-light"
hover = "$bg-hover"
pressed = "$bg-pressed"
segmented-selected = "$bg-raised"
segmented-selected-border = "$fg-dim"
selection = "$bg-selected"
selection-text = "$fg-bright"
selection-inactive = "$bg-selected-inactive"
selection-light = "$bg-selected"
danger = "$red"
warning = "$amber"
success = "$leaf"
info = "$blue"
danger-bg = "#3a2224"
warning-bg = "#38301c"
success-bg = "#1f3326"
info-bg = "#1d2f45"

title-bar = "$bg-deep"
toolbar = "$bg-deep"
status-bar = "$bg-deep"
status-bar-text = "$fg-muted"
tool-window = "$bg-panel"
tool-window-header = "$bg-panel"
tool-window-stripe = "$bg-deep"
tab-bar = "$bg-editor"
tab-active = "$bg-editor"
tab-inactive = "$bg-editor"
tab-hover = "#1f242c"
tab-active-text = "$fg-bright"
tab-inactive-text = "$fg-muted"
tab-underline = "$copper"
tab-selected-inactive = "$bg-editor"
tab-underline-inactive = "$line-strong"
scrollbar = "#929cab59"
scrollbar-hover = "#929cab8c"
scrollbar-track = "#00000000"
progress = "$copper"
progress-track = "$line"
notification = "$bg-raised"
notification-border = "#3a414d"
notification-text = "$fg"
notification-link = "$blue"
notification-icon-hover = "#ffffff1a"
notification-more = "#1f232b"
notification-more-text = "$fg-muted"
non-project-file = "#2a221d"
run-widget-running = "$leaf"
run-widget-stop = "$red"
run-widget-icon = "#ced0d6"
run-widget-run-icon = "#57965c"
run-widget-running-icon = "#ffffff"
drag-and-drop-border = "#2f65ca"
drag-and-drop-row = "#2f65ca33"
tree-text = "$fg"
tree-indent-guide = "#505355"
list-button-hover = "#3a5677"
list-button-separator = "#ffffff33"

# Controls
checkbox-background = "$bg-deep"
checkbox-border = "$line-strong"
checkbox-background-selected = "$copper"
checkbox-border-selected = "$copper"
checkbox-check = "#1a110b"
checkbox-background-disabled = "$bg-panel"
checkbox-border-disabled = "$line"
checkbox-check-disabled = "$fg-dim"

# Icons: the colours of the New UI icon palette (dark), so the icons keep
# their own colours. Blue, Green and Red Solid have no dark colour.
icon-gray-fill = "#43454a"
icon-gray-secondary-stroke = "#6f737a"
icon-gray-stroke = "#ced0d6"
icon-blue-fill = "#25324d"
icon-blue-solid = "#548af7"
icon-blue-stroke = "#548af7"
icon-green-fill = "#253627"
icon-green-solid = "#57965c"
icon-green-stroke = "#57965c"
icon-red-fill = "#402929"
icon-red-solid = "#db5c5c"
icon-red-stroke = "#db5c5c"
icon-yellow-fill = "#3d3223"
icon-yellow-solid = "#f2c55c"
icon-yellow-stroke = "#d6ae58"
icon-orange-fill = "#45322b"
icon-orange-stroke = "#c77d55"
icon-purple-fill = "#2f2936"
icon-purple-stroke = "#a571e6"
icon-teal-fill = "#1d3838"
icon-teal-stroke = "#24a394"

editor-background = "$bg-editor"
editor-text = "$fg"
gutter = "$bg-editor"
line-number = "$fg-gutter"
line-number-active = "#c5ccd8"
caret = "$fg-bright"
current-line = "$bg-current-line"
editor-selection = "#3b6aa459"
search-match = "#e0814a59"
search-match-active = "#e0814a80"
search-match-stripe = "#e0814a"
search-field = "$bg-editor"
search-field-border = "$line"
search-field-error = "$red"
search-option-selected = "$bg-pressed"
indent-guide = "#ffffff14"
indent-guide-active = "#ffffff38"
right-margin = "#ffffff14"
tearline = "$line-strong"
whitespace = "#ffffff33"
soft-wrap-sign = "#ffffff33"
completion-popup = "#232832"
completion-selection = "#32405a"
completion-match = "$copper-light"
documentation-popup = "#232832"
breakpoint = "#f2777547"
execution-point = "#e8b45a47"
execution-point-not-top = "#e8b45a24"
bookmark = "$amber"

gutter-added = "#5fbf7a"
gutter-modified = "$blue"
gutter-deleted = "$red"
gutter-whitespace-modified = "#5a4c3c"
gutter-ignored-added = "#5fbf7a"
gutter-ignored-modified = "$blue"
gutter-ignored-deleted = "$red"
stripe-added = "#4f9a67"
stripe-modified = "#4d79b3"
stripe-deleted = "#8a5a5a"
marker-popup-border = "$line"
marker-popup-toolbar = "$bg-panel"
marker-popup-text = "$bg-current-line"
diff-added = "#1f3a2a"
diff-removed = "#472529"
diff-changed = "#1f3350"
diff-conflict = "#4a3a1c"
git-added = "$leaf"
git-modified = "$blue"
git-deleted = "$red"
git-renamed = "$violet"
git-untracked = "$amber"
git-ignored = "$fg-dim"
git-conflict = "#ff8f6b"
git-merged = "#c792d8"

diagnostic-error = "$red"
diagnostic-warning = "$amber"
diagnostic-info = "$blue"
diagnostic-hint = "$fg-muted"
diagnostic-error-stripe = "$red"
diagnostic-warning-stripe = "$amber"
diagnostic-weak-warning-stripe = "$blue"

terminal-background = "$bg-editor"
terminal-foreground = "$fg"
terminal-black = "#76809a"
terminal-red = "$red"
terminal-green = "$leaf"
terminal-yellow = "$amber"
terminal-blue = "$blue"
terminal-magenta = "$violet"
terminal-cyan = "$teal"
terminal-white = "#c5ccd8"
terminal-bright-black = "#8791a3"
terminal-bright-red = "#ff9a98"
terminal-bright-green = "#9fe3ab"
terminal-bright-yellow = "#f3cb7e"
terminal-bright-blue = "#98c9ff"
terminal-bright-magenta = "#dbbcf7"
terminal-bright-cyan = "#82e0d1"
terminal-bright-white = "$fg-bright"

# The Terminal tool window: ANSI text and cell backgrounds, search
# matches, command separators and the failed-command marker.
terminal-default-background = "$bg-editor"
terminal-default-foreground = "$fg"
terminal-ansi-black = "#76809a"
terminal-ansi-red = "$red"
terminal-ansi-green = "$leaf"
terminal-ansi-yellow = "$amber"
terminal-ansi-blue = "$blue"
terminal-ansi-magenta = "$violet"
terminal-ansi-cyan = "$teal"
terminal-ansi-white = "#c5ccd8"
terminal-ansi-bright-black = "#8791a3"
terminal-ansi-bright-red = "#ff9a98"
terminal-ansi-bright-green = "#9fe3ab"
terminal-ansi-bright-yellow = "#f3cb7e"
terminal-ansi-bright-blue = "#98c9ff"
terminal-ansi-bright-magenta = "#dbbcf7"
terminal-ansi-bright-cyan = "#82e0d1"
terminal-ansi-bright-white = "$fg-bright"
terminal-ansi-black-background = "$bg-deep"
terminal-ansi-red-background = "$red"
terminal-ansi-green-background = "$leaf"
terminal-ansi-yellow-background = "$amber"
terminal-ansi-blue-background = "$blue"
terminal-ansi-magenta-background = "$violet"
terminal-ansi-cyan-background = "$teal"
terminal-ansi-white-background = "#c5ccd8"
terminal-ansi-bright-black-background = "#4b5360"
terminal-ansi-bright-red-background = "#ff9a98"
terminal-ansi-bright-green-background = "#9fe3ab"
terminal-ansi-bright-yellow-background = "#f3cb7e"
terminal-ansi-bright-blue-background = "#98c9ff"
terminal-ansi-bright-magenta-background = "#dbbcf7"
terminal-ansi-bright-cyan-background = "#82e0d1"
terminal-ansi-bright-white-background = "$fg-bright"
terminal-search-match = "#e0814a59"
terminal-search-match-text = "$fg"
terminal-search-match-current = "#e0814a80"
terminal-search-match-current-text = "$fg"
terminal-separator = "#262c35"
terminal-error-marker = "$red"

# The variables view of the debugger (Debugger.Variables.*).
debugger-value-name = "$copper-light"
debugger-type = "$fg-muted"
debugger-changed-value = "$blue"
debugger-collecting-data = "$fg-muted"
debugger-evaluating = "$fg-muted"
debugger-modifying-value = "$blue"
debugger-exception = "$red"
debugger-error-message = "$red"

[syntax]
keyword = { fg = "$copper-soft" }
constant-builtin = { fg = "$copper-light" }
string = { fg = "$green" }
string-escape = { fg = "$teal" }
string-escape-invalid = { fg = "$red", underline = "wavy", underline-color = "$red" }
number = { fg = "$cyan" }
comment = { fg = "#7e8899", italic = true }
docstring = { fg = "#86a58f", italic = true }
docstring-tag = { fg = "#9bb7a3", italic = true, bold = true }
todo = { fg = "$amber", bold = true }
function-decl = { fg = "$blue-code" }
function-call = { fg = "$steel" }
method-decl = { fg = "$blue-code" }
method-call = { fg = "$steel" }
class = { fg = "$gold" }
class-decl = { fg = "$gold", bold = true }
parameter = { fg = "$sand" }
self = { fg = "$rose", italic = true }
keyword-argument = { fg = "#c9b184" }
variable-reassigned = { underline = "single" }
constant = { fg = "#d9a8f2" }
attribute = { fg = "#b9c4d6" }
builtin = { fg = "$teal" }
decorator = { fg = "#d3a8f5" }
annotation = { fg = "$teal-light" }
dunder = { fg = "#5fc0c8", italic = true }
fstring-expression = { bg = "#ffffff0d" }
fstring-brace = { fg = "$amber" }
operator = { fg = "#c2cad6" }
punctuation = { fg = "#9aa3b2" }
bracket = { fg = "#b4bccb" }
tag = { fg = "$copper-soft" }
tag-attribute = { fg = "$gold" }
property-key = { fg = "$blue-code" }
link = { fg = "$blue", underline = "single" }

diagnostic-error = { underline = "wavy", underline-color = "$red" }
diagnostic-warning = { underline = "wavy", underline-color = "$amber" }
diagnostic-info = { underline = "dotted", underline-color = "$blue" }
diagnostic-hint = { underline = "dotted", underline-color = "$fg-muted" }
diagnostic-unresolved = { fg = "$red", underline = "wavy", underline-color = "$red" }
diagnostic-unused = { fg = "#707a8c" }
diagnostic-deprecated = { strikethrough = true }
typo = { underline = "wavy", underline-color = "#7fbf8a" }
matching-bracket = { bg = "#6fb1ff40", bold = true }
unmatched-bracket = { bg = "#f2777547" }
identifier-read = { bg = "#6fb1ff26" }
identifier-write = { bg = "#e8b45a30" }
folded-text = { fg = "$fg-muted", bg = "#ffffff12" }
inlay-hint = { fg = "#8e98aa", bg = "#ffffff0d", italic = true }
console-error = { fg = "$red" }
console-input = { fg = "$teal-light" }
console-system = { fg = "$fg" }
debugger-inlined-values = { fg = "$fg-dim", italic = true }
debugger-inlined-values-modified = { fg = "$gold", italic = true }
debugger-inlined-values-execution-line = { fg = "#9fb4d4", italic = true }
debugger-evaluated-expression = { bg = "#424242" }
debugger-evaluated-expression-execution-line = { bg = "#474747" }

[font]
# Inter and JetBrains Mono ship with the IDE (crates/platform/ui/assets/fonts).
ui-family = ["Inter", "system-ui", "Segoe UI", "Helvetica Neue", "sans-serif"]
ui-size = 13.0
editor-family = ["JetBrains Mono", "Cascadia Mono", "Menlo", "DejaVu Sans Mono", "Consolas", "monospace"]
editor-size = 13.0
editor-line-spacing = 1.2
editor-ligatures = false
terminal-family = ["JetBrains Mono", "Cascadia Mono", "Menlo", "DejaVu Sans Mono", "Consolas", "monospace"]
terminal-size = 13.0

# Layout of the main window (New UI with islands). Values follow the
# IntelliJ Platform Community theme files and metrics (Apache-2.0, see
# NOTICE).
[metrics]
row-height = 24.0
row-height-compact = 22.0
tree-indent = 19.0
tab-height = 40.0
tab-selection-height = 28.0
toolbar-height = 42.5
toolbar-button-size = 30.0
status-bar-height = 31.0
tool-window-header-height = 41.0
stripe-width = 40.0
stripe-button-size = 30.0
gutter-width = 48.0
gutter-padding = 8.0
indent-guide-width = 1.0
caret-width = 2.0
panel-padding = 8.0
padding-small = 4.0
padding = 8.0
padding-large = 16.0
island-gap = 5.0
corner-radius = 4.0
corner-radius-small = 3.0
button-radius = 6.0
island-radius = 10.0
border-width = 1.0
focus-width = 2.0
scrollbar-width = 10.0
icon-size = 16.0
