[package]
name = "ui"
description = "Component layer of Pyoxide IDE on GPUI: theme tokens, fonts, icons, common components and the UI command index"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
commands.workspace = true
gpui.workspace = true
image = { version = "0.25", default-features = false }
name-match.workspace = true
pulldown-cmark.workspace = true
resvg.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec = "1"
themes.workspace = true

# Pointer shapes are set natively on macOS (see src/pointer.rs); these
# crates are already in GPUI's dependency tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
raw-window-handle = "0.6"

# GPUI 0.2.2 pulls in xattr 0.2.3 (through gpui_http_client and
# zed-async-tar), which uses `libc::ENOATTR` on Linux; libc 0.2.190 no
# longer defines it there. Remove this pin when GPUI is upgraded.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

# Metal shaders are compiled at start-up on machines without Xcode
# (ADR 0007); the product binary enables the same feature by default.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["runtime_shaders", "test-support"] }
