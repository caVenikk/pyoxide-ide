[package]
name = "editor"
description = "Code editor of Pyoxide IDE on GPUI: virtualized line painting, carets, selections, clipboard, undo and input methods"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
gpui.workspace = true
serde.workspace = true
serde_json.workspace = true
text.workspace = true
themes.workspace = true
ui.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["runtime_shaders", "test-support"] }
