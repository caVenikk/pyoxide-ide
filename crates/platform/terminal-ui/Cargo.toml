[package]
name = "terminal-ui"
description = "Terminal view of Pyoxide IDE on GPUI (ADR 0014): the grid element that paints a session's snapshot, the terminal colours of the theme, and the session view with keys, input methods, mouse selection and reporting, scrolling, clipboard and the Terminal commands"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
editor.workspace = true
flume.workspace = true
gpui.workspace = true
serde_json.workspace = true
terminal.workspace = true
themes.workspace = true
ui.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

# Metal shaders are compiled at start-up on machines without Xcode
# (ADR 0007); the product binary enables the same feature by default.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["runtime_shaders", "test-support"] }
