[package]
name = "settings-ui"
description = "The Settings window of Pyoxide IDE (ADR 0017): page tree, banner, bottom bar, the page trait and registry, and the application's settings store with its change events"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
editor.workspace = true
gpui.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
text.workspace = true
themes.workspace = true
toml.workspace = true
ui.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["runtime_shaders", "test-support"] }
