[package]
name = "secrets"
description = "Secret storage for Pyoxide IDE: OS credential store, KeePass database, memory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
quick-xml.workspace = true
serde.workspace = true
thiserror.workspace = true
zeroize.workspace = true
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
keepass = { version = "0.15", features = ["save_kdbx4"] }
aes = "0.9"
base64 = "0.23"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
dirs = "7"
toml = "1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
chacha20 = "0.10"
sha2 = "0.11"
tempfile = "3"
