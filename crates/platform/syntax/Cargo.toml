[package]
name = "syntax"
description = "Language-agnostic syntax layer of Pyoxide IDE: incremental tree-sitter parsing and highlight spans resolved to theme text roles"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Lines break at `\n` only, as in `text` (see there).
ropey = { version = "1.6", default-features = false, features = ["simd"] }
text.workspace = true
themes.workspace = true
tree-sitter = "0.25"
