# Pyoxide keymap for Windows and Linux. Database: the Database tool window
# (the database module, ADR 0022), joined after the workbench's keymap.

# The Database tool window with the focus: New (the menu of the "+"
# button, as New in a tree of the reference) and the Data Sources dialog
# for the selected data source (Project Structure's keystroke, which the
# reference gives data source properties).
[[context]]
name = "DatabaseExplorer"
[context.bindings]
"alt-insert" = "db.explorer.new-data-source"
"ctrl-alt-shift-s" = "db.explorer.properties"
"up" = "db.explorer.up"
"down" = "db.explorer.down"
"right" = "db.explorer.expand-or-next"
"left" = "db.explorer.collapse-or-parent"
"enter" = "db.explorer.toggle"
# The context menus' actions: the macOS keystrokes in the Windows and Linux
# keymap's terms (Refresh Ctrl+F5, Stop Ctrl+F2, Quick Documentation
# Ctrl+Q), and the context menu key.
"menu" = "db.explorer.context-menu"
"shift-f10" = "db.explorer.context-menu"
"ctrl-f5" = "db.explorer.refresh"
"ctrl-f2" = "db.explorer.deactivate"
"shift-f6" = "db.explorer.rename"
"alt-shift-up" = "db.explorer.move-up"
"alt-shift-down" = "db.explorer.move-down"
"ctrl-q" = "db.explorer.quick-doc"
"ctrl-alt-shift-c" = "db.explorer.copy-reference"
"ctrl-d" = "db.explorer.duplicate"
"ctrl-alt-shift-g" = "db.explorer.generate-ddl"
"ctrl-alt-shift-f5" = "db.explorer.force-refresh"
"delete" = "db.explorer.delete"
