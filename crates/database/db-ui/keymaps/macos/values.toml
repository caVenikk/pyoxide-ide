# Pyoxide keymap for macOS. Database: values in the data grid, joined
# after the grid's keys (the database module, ADR 0021).

# The cells with the focus: the side panel on the current cell, the current
# row as a record, the sum of the selection to the clipboard.
[[context]]
name = "DatabaseGrid"
[context.bindings]
"shift-enter" = "db.grid.value-editor"
"cmd-shift-enter" = "db.grid.record-view"
"cmd-shift-c" = "db.grid.copy-aggregation"
