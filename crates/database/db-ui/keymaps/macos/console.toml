# Pyoxide keymap for macOS. Database consoles: Execute in the editor of a
# SQL file (a console or a file attached to a data source). The key keeps its
# meaning in every other editor.
[[context]]
name = "Editor && SqlFile"
[context.bindings]
"cmd-enter" = "db.console.execute"

[[context]]
name = "DatabasePlanTree"
[context.bindings]
"up" = "db.plan.up"
"down" = "db.plan.down"
"left" = "db.plan.left"
"right" = "db.plan.right"

[[context]]
name = "DatabasePlanTree || DatabasePlanRaw"
[context.bindings]
"tab" = "db.plan.switch-view"
"escape" = "workbench.focus-editor"

# The PostgreSQL raw result embeds the standard data grid, whose own Escape
# dismisses table reads. This result has already finished loading.
[[context]]
name = "DatabasePlanRaw > DatabaseGrid"
[context.bindings]
"escape" = "workbench.focus-editor"
