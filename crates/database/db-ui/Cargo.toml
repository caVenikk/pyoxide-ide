[package]
name = "db-ui"
description = "Database module of Pyoxide IDE on GPUI (ADR 0021, 0022): the Database tool window, the Data Sources dialog and the db.explorer commands, contributed to a product as a workbench module; it sees data sources and connections only through the store the product gives it"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
console.workspace = true
console-ui.workspace = true
async-trait.workspace = true
chrono.workspace = true
db-core.workspace = true
db-model.workspace = true
db-session.workspace = true
editor.workspace = true
futures.workspace = true
gpui.workspace = true
project.workspace = true
progress.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
settings-ui.workspace = true
sql-syntax.workspace = true
syntax.workspace = true
text.workspace = true
themes.workspace = true
toml.workspace = true
toml_edit = "0.25"
ui.workspace = true
workbench.workspace = true
zeroize.workspace = true

[dev-dependencies]
db-model.workspace = true
db-session = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
native-path.workspace = true
tempfile = "3"
workbench = { workspace = true, features = ["test-support"] }

# Metal shaders are compiled at start-up on machines without Xcode
# (ADR 0007); the product binary enables the same feature by default.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["runtime_shaders", "test-support"] }
