[package]
name = "db-cli"
description = "pyoxide-db: command-line front-end of the Pyoxide database engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "pyoxide-db"
path = "src/main.rs"

[dependencies]
brand.workspace = true
commands.workspace = true
db-core.workspace = true
db-service.workspace = true
secrets.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive", "env"] }
