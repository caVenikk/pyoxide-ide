[package]
name = "pyoxide-cli"
description = "pyoxide: command-line front-end of the Pyoxide Python IDE, composing the platform commands and the Python environment commands"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "pyoxide"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
commands.workspace = true
db-service.workspace = true
py-env.workspace = true
secrets.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
tempfile = "3"
