[package]
name = "py-env"
description = "Python environments for Pyoxide IDE: interpreter discovery, project model, uv and pip operations, PyPI lookup and the env.* commands"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
commands.workspace = true
dirs = "7"
rustls-native-certs = "0.8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "fs"] }
tokio-util = "0.7"
toml = "1"
ureq = "3"

[dev-dependencies]
tempfile = "3"
