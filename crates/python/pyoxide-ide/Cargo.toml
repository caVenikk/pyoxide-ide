[package]
name = "pyoxide-ide"
description = "pyoxide-ide: the Pyoxide Python IDE application, composing the platform workbench with Python support"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "pyoxide-ide"
path = "src/main.rs"

[features]
default = ["runtime-shaders"]
# Compile the Metal shaders at start-up instead of at build time (no Xcode
# needed). Release builds made with Xcode turn it off (ADR 0007).
runtime-shaders = ["gpui/runtime_shaders"]

[dependencies]
code-intel.workspace = true
code-intel-ui.workspace = true
dirs = "7"
editor.workspace = true
gpui.workspace = true
lsp-client.workspace = true
process.workspace = true
project.workspace = true
py-env.workspace = true
py-lsp.workspace = true
py-run.workspace = true
py-syntax.workspace = true
run-config.workspace = true
serde_json.workspace = true
themes.workspace = true
ui.workspace = true
workbench.workspace = true

[dev-dependencies]
code-intel = { workspace = true, features = ["fake"] }
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"
text.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["runtime_shaders", "test-support"] }
