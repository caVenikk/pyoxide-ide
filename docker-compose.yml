# Local databases for development and integration tests.
# Host ports avoid the defaults so they do not clash with databases already
# running on a developer machine. Tests read the same values (see
# docs/testing-databases.md).
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${PYOXIDE_DB_PASSWORD:-pyoxide}
      APP_USER: pyoxide
      APP_USER_PASSWORD: ${PYOXIDE_DB_PASSWORD:-pyoxide}
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:18-alpine
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: pyoxide
      POSTGRES_PASSWORD: ${PYOXIDE_DB_PASSWORD:-pyoxide}
      POSTGRES_DB: pyoxide
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyoxide -d pyoxide"]
      interval: 5s
      timeout: 5s
      retries: 30
